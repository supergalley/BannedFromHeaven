worker_processes  1;

events { worker_connections  1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;

  # Big files, slow users, no drama
  client_max_body_size 0;

  server {
    listen 8080;
    server_name _;

    # Images
    location /uploads/ {
      alias /data/uploads/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Video clips (Range support for seeking)
    location /clips/ {
      alias /data/clips/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Thumbnails
    location /clip_thumbs/ {
      alias /data/clip_thumbs/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
  }
}
