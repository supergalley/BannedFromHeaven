<div class="mb-3">
  <label for="message-image" class="form-label">Image (optional)</label>
  <input id="message-image" name="image" type="file" class="form-control"
         accept="image/jpeg,image/png,image/gif,image/webp" aria-describedby="message-image-help">
  <div id="message-image-help" class="form-text">
    JPEG, PNG, GIF or WebP, up to 5 MB and 16 million pixels. Animated images are sent as a still image.
    You can send an image with or without text.
  </div>
</div>
