{% extends "base.html" %}
{% block title %}Reset Password - BannedFromHeaven.com{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4"><div class="col-md-5">
  <h3>Reset Password</h3>
  {% if valid %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="form-label" for="password">New password</label>
    <input class="form-control mb-3" id="password" type="password" name="password" autocomplete="new-password" minlength="6" maxlength="256" required>
    <label class="form-label" for="confirm_password">Confirm new password</label>
    <input class="form-control mb-3" id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" minlength="6" maxlength="256" required>
    <button class="btn btn-primary w-100" type="submit">Reset password</button>
  </form>
  {% else %}
  <p class="alert alert-warning">This reset link is invalid, expired, or has already been used.</p>
  <a href="{{ url_for('auth.forgot_password') }}">Request a new reset link</a>
  {% endif %}
</div></div>
{% endblock %}
