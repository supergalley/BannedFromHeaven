<style>
.user-ban-badge { background-color: #dc3545; color: #fff; cursor: help; }
.user-strike-badge { background-color: #198754; color: #fff; cursor: pointer; }
.user-strike-badge[data-strike-level="2"] { background-color: #fd7e14; color: #111; }
.user-strike-badge[data-strike-level="3"] { background-color: #dc3545; color: #fff; }
.user-strike-badge:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.user-strike-card { position: fixed; z-index: 3100; max-width: calc(100vw - 16px); padding: 10px 12px; background: #171717; color: #fff; border: 1px solid #777; border-radius: 8px; box-shadow: 0 4px 16px #0009; font-size: 0.85rem; line-height: 1.6; }
</style>
<script>
// Decorate visible labels only; forms and links retain the original username.
(() => {
  const newMembers = new Set({{ new_member_names|tojson }});
  const strikes = new Map(Object.entries({{ username_strike_counts|tojson }}));
  const strikeUrls = new Map(Object.entries({{ username_strike_urls|tojson }}));
  const bans = new Map(Object.entries({{ username_active_bans|tojson }}));
  function updateBanBadge(badge) {
    let minutes = Math.ceil((Date.parse(badge.dataset.banUntil) - Date.now()) / 60000);
    if (!(minutes > 0)) { badge.remove(); return; }
    const days = Math.floor(minutes / 1440); minutes %= 1440;
    const hours = Math.floor(minutes / 60); minutes %= 60;
    const parts = [[days, 'day'], [hours, 'hour'], [minutes, 'minute']]
      .filter(([value]) => value).map(([value, unit]) => value + ' ' + unit + (value === 1 ? '' : 's'));
    const text = 'Ban remaining: ' + parts.join(', ');
    badge.title = text;
    badge.setAttribute('aria-label', text);
  }
  setInterval(() => document.querySelectorAll('.user-ban-badge').forEach(updateBanBadge), 60000);
  function usernameLabel(username) {
    const name = String(username || '');
    const label = document.createElement('span');
    label.textContent = name + (newMembers.has(name) ? ' ✨' : '');
    const count = strikes.get(name) || 0;
    if (count) {
      const badge = document.createElement('span');
      badge.className = 'badge rounded-pill ms-1 user-strike-badge';
      badge.dataset.strikeLevel = Math.min(count, 3);
      badge.dataset.strikeUrl = strikeUrls.get(name);
      badge.setAttribute('role', 'button');
      badge.tabIndex = 0;
      badge.setAttribute('aria-haspopup', 'dialog');
      badge.setAttribute('aria-expanded', 'false');
      badge.setAttribute('aria-controls', 'user-strike-card');
      badge.textContent = 'Strike';
      badge.setAttribute('aria-label', count + ' active warning strike' + (count === 1 ? '' : 's'));
      label.append(' ', badge);
    }
    const until = bans.get(name);
    if (until && Date.parse(until) > Date.now()) {
      const badge = document.createElement('span');
      badge.className = 'badge rounded-pill ms-1 bg-danger user-ban-badge';
      badge.dataset.banUntil = until;
      badge.tabIndex = 0;
      badge.textContent = 'Ban';
      updateBanBadge(badge);
      label.append(' ', badge);
    }
    return label;
  }
  window.bfhDisplayUsername = username => usernameLabel(username).textContent;
  window.bfhUsernameHtml = username => usernameLabel(username).innerHTML;
  window.bfhRenderUsername = (element, username) => {
    element.replaceChildren(...usernameLabel(username).childNodes);
  };
  window.bfhRenderUsernameList = (element, usernames) => {
    element.replaceChildren();
    usernames.forEach((username, index) => {
      if (index) element.append(', ');
      element.append(usernameLabel(username));
    });
  };
})();
</script>

<script src="{{ url_for('static', filename='user_strikes.js') }}" defer></script>
