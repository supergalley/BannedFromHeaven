{% extends "base.html" %}
{% block title %}Edit thread - jokes.supergalley.com{% endblock %}

{% block content %}
<h3 class="mt-3 mb-3">Edit thread</h3>

<div class="joke-card mt-3">
  <form method="post">
    <div class="mb-3">
      <label class="form-label" for="title">Title</label>
      <input
        type="text"
        id="title"
        name="title"
        class="form-control"
        required
        value="{{ thread.title }}"
      >
    </div>

    <div class="mb-3">
      <label class="form-label" for="body">Body</label>
      <textarea
        id="body"
        name="body"
        rows="6"
        class="form-control"
        required
      >{{ thread.body }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary btn-sm">
      Save changes
    </button>

    <a href="{{ url_for('forum.view_thread', thread_id=thread.id) }}"
       class="btn btn-secondary btn-sm ms-2">
      Cancel
    </a>
  </form>
</div>
{% endblock %}
