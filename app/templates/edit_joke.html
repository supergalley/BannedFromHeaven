{% extends "base.html" %}
{% block title %}Edit post - jokes.supergalley.com{% endblock %}

{% block content %}
<h3 class="mt-3">Edit post</h3>

<form method="post">
  <div class="mb-3">
    <label class="form-label">Type</label>
    <select name="type" class="form-select">
      <option value="joke" {% if not joke.is_meme %}selected{% endif %}>Joke (text)</option>
      <option value="meme" {% if joke.is_meme %}selected{% endif %}>Meme (image post)</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Category</label>
    <select name="category_id" class="form-select">
      <option value="">Uncategorised</option>
      {% for cat in categories %}
        <option value="{{ cat.id }}" {% if joke.category_id == cat.id %}selected{% endif %}>
          {{ cat.name }}
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Text</label>
    <textarea name="body" class="form-control" rows="6">{{ joke.body }}</textarea>
    <div class="form-text">For memes this is the caption / text under the image. Leave blank for image-only.</div>
  </div>

  <button type="submit" class="btn btn-primary">Save changes</button>
  <a href="{{ url_for('main.joke_detail', joke_id=joke.id) }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
