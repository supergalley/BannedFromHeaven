{% extends "base.html" %}
{% block title %}New thread - BannedFromHeaven.com{% endblock %}

{% block content %}
<h3 class="mt-3 mb-3">Start a new thread</h3>

<form method="post">
  <div class="mb-3">
    <label class="form-label">Title</label>
    <input type="text" name="title" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Body</label>
    <textarea name="body" rows="6" class="form-control" required></textarea>
  </div>

  <button type="submit" class="btn btn-primary btn-sm">Post thread</button>
  <a href="{{ url_for('main.forum') }}" class="btn btn-outline-light btn-sm">Cancel</a>
</form>
{% endblock %}
