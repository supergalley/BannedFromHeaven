version: "3.8"
services:
  bannedfromheaven:
    image: bannedfromheaven:latest
    container_name: bannedfromheaven
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN}"
      CLIPS: "${CLIPS}"
      force_snow: "false"
      force_fireworks: "false"
      IMAGES: "${IMAGES}"
      jokeDB: "${JOKE_DB}"
      MEDIA_DOMAIN: "${MEDIA_DOMAIN}"
      SECRET_KEY: "${SECRET_KEY}"
      THUMBNAILS: "${THUMBS}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY}"
      UPLOAD_DOMAIN: "${UPLOAD_DOMAIN}"
      UPLOADS_SHARED_SECRET: "${UPLOADS_SHARED_SECRET}"
    volumes:
      - /XanderSSD/BannedFromHeaven/app:/app/app:rw
      - /XanderSSD/BannedFromHeaven/data/uploads:/jokes/data/uploads:rw
      - /XanderSSD/BannedFromHeaven/data/clips:/jokes/data/clips:rw
      - /XanderSSD/BannedFromHeaven/data/clip_thumbs:/jokes/data/clip_thumbs:rw
      - /XanderSSD/BannedFromHeaven/data/jokes.db:/data/jokes.db:rw
    networks:
      traefik:
        ipv4_address: 192.168.2.36
      bannedfromheaven:
        ipv4_address: 192.168.4.2
    labels:
      - "traefik.enable=true"

      # -------------------------
      # 1) Main HTTPS router (real site)
      # -------------------------
      - "traefik.http.routers.bfh.rule=Host(`bannedfromheaven.com`) || Host(`jokes.supergalley.com`)"
      - "traefik.http.routers.bfh.entrypoints=websecure"
      - "traefik.http.routers.bfh.tls=true"
      - "traefik.http.routers.bfh.tls.certresolver=le"
      - "traefik.http.services.bfh.loadbalancer.server.port=8000"

      # -------------------------
      # 2) HTTP -> HTTPS redirect for the real hosts
      # -------------------------
      - "traefik.http.routers.bfh-http.rule=Host(`bannedfromheaven.com`) || Host(`jokes.supergalley.com`)"
      - "traefik.http.routers.bfh-http.entrypoints=web"
      - "traefik.http.routers.bfh-http.middlewares=bfh-https-redirect"
      - "traefik.http.middlewares.bfh-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.bfh-https-redirect.redirectscheme.permanent=true"

      # -------------------------
      # 3) www.bannedfromheaven.com -> bannedfromheaven.com (HTTPS)
      # -------------------------
      - "traefik.http.routers.bfh-www-https.rule=Host(`www.bannedfromheaven.com`)"
      - "traefik.http.routers.bfh-www-https.entrypoints=websecure"
      - "traefik.http.routers.bfh-www-https.tls=true"
      - "traefik.http.routers.bfh-www-https.tls.certresolver=le"
      - "traefik.http.routers.bfh-www-https.middlewares=bfh-www-to-root"

      # -------------------------
      # 4) www.bannedfromheaven.com -> bannedfromheaven.com (HTTP)
      # -------------------------
      - "traefik.http.routers.bfh-www-http.rule=Host(`www.bannedfromheaven.com`)"
      - "traefik.http.routers.bfh-www-http.entrypoints=web"
      - "traefik.http.routers.bfh-www-http.middlewares=bfh-www-to-root"

      # Middleware that performs the www -> apex redirect (keeps path/query)
      - "traefik.http.middlewares.bfh-www-to-root.redirectregex.regex=^https?://www\\.bannedfromheaven\\.com/(.*)"
      - "traefik.http.middlewares.bfh-www-to-root.redirectregex.replacement=https://bannedfromheaven.com/$$1"
      - "traefik.http.middlewares.bfh-www-to-root.redirectregex.permanent=true"

  bannedfromheaven_nginx:
    image: nginx:alpine
    container_name: bannedfromheaven_nginx
    restart: unless-stopped
    volumes:
      - /XanderSSD/BannedFromHeaven/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /XanderSSD/BannedFromHeaven/data:/data:ro
    networks:
      traefik:
        ipv4_address: 192.168.2.38
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bfh-media.rule=Host(`media.bannedfromheaven.com`)"
      - "traefik.http.routers.bfh-media.entrypoints=websecure"
      - "traefik.http.routers.bfh-media.tls=true"
      - "traefik.http.routers.bfh-media.tls.certresolver=le"
      - "traefik.http.services.bfh-media.loadbalancer.server.port=8080"
      - "traefik.http.routers.bfh-media-http.rule=Host(`media.bannedfromheaven.com`)"
      - "traefik.http.routers.bfh-media-http.entrypoints=web"
      - "traefik.http.routers.bfh-media-http.middlewares=bfh-redirect-https"

  bannedfromheaven_tusd:
    image: tusproject/tusd:latest
    container_name: bannedfromheaven_tusd
    restart: unless-stopped
    command: >
      -upload-dir /tusd
      -behind-proxy
      -hooks-http http://bannedfromheaven_processor:8080/hooks/tusd
      -hooks-enabled-events post-finish
      -max-size 1073741824
    environment:
      UPLOAD_DOMAIN: "${UPLOAD_DOMAIN}"
    volumes:
      - /XanderSSD/BannedFromHeaven/data/tusd:/tusd:rw
    networks:
      traefik:
        ipv4_address: 192.168.2.39
      bannedfromheaven:
        ipv4_address: 192.168.4.3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bfh-uploads.rule=Host(`${UPLOAD_DOMAIN}`)"
      - "traefik.http.routers.bfh-uploads.entrypoints=websecure"
      - "traefik.http.routers.bfh-uploads.tls=true"
      - "traefik.http.routers.bfh-uploads.tls.certresolver=le"
      - "traefik.http.services.bfh-uploads.loadbalancer.server.port=8080"

      - "traefik.http.routers.bfh-uploads-http.rule=Host(`${UPLOAD_DOMAIN}`)"
      - "traefik.http.routers.bfh-uploads-http.entrypoints=web"
      - "traefik.http.routers.bfh-uploads-http.middlewares=bfh-redirect-https"

      # CORS (keep this, it’s fine)
      - "traefik.http.middlewares.bfh-uploads-cors.headers.accesscontrolalloworiginlist=https://bannedfromheaven.com,https://jokes.supergalley.com" # https://www.bannedfromheaven.com,
      - "traefik.http.middlewares.bfh-uploads-cors.headers.accesscontrolallowmethods=GET,POST,PATCH,HEAD,OPTIONS"
      - "traefik.http.middlewares.bfh-uploads-cors.headers.accesscontrolexposeheaders=Tus-Resumable,Upload-Length,Upload-Offset,Upload-Metadata,Location"
      - "traefik.http.middlewares.bfh-uploads-cors.headers.accesscontrolallowheaders=Tus-Resumable,Upload-Length,Upload-Offset,Upload-Metadata,Content-Type,Authorization,X-Requested-With"
      - "traefik.http.middlewares.bfh-uploads-cors.headers.addvaryheader=true"
      - "traefik.http.routers.bfh-uploads.middlewares=bfh-uploads-cors@docker"

      # OPTIONS preflight catcher (good idea)
      - "traefik.http.routers.bfh-uploads-options.rule=Host(`${UPLOAD_DOMAIN}`) && PathPrefix(`/files`) && Method(`OPTIONS`)"
      - "traefik.http.routers.bfh-uploads-options.entrypoints=websecure"
      - "traefik.http.routers.bfh-uploads-options.tls=true"
      - "traefik.http.routers.bfh-uploads-options.middlewares=bfh-uploads-cors@docker"
      - "traefik.http.routers.bfh-uploads-options.service=noop@internal"
      - "traefik.http.routers.bfh-uploads-options.priority=100"

      
  bannedfromheaven_processor:
    image: bannedfromheaven:latest
    container_name: bannedfromheaven_processor
    restart: unless-stopped
    # This assumes we add app/upload_worker.py and expose a tiny web server on 8080
    command: ["python", "-m", "app.upload_worker"]
    environment:
      UPLOAD_DOMAIN: "${UPLOAD_DOMAIN}"
      UPLOADS_SHARED_SECRET: "${UPLOADS_SHARED_SECRET}"
      FLASK_INTERNAL_URL: "http://bannedfromheaven:8000"
      UPLOADS_DIR: "/jokes/data/uploads"
      CLIPS_DIR: "/jokes/data/clips"
      THUMBS_DIR: "/jokes/data/clip_thumbs"
      TUSD_DIR: "/tusd"
    volumes:
      - /XanderSSD/BannedFromHeaven/app:/app/app:rw
      - /XanderSSD/BannedFromHeaven/data/uploads:/data/uploads:rw
      - /XanderSSD/BannedFromHeaven/data/clips:/data/clips:rw
      - /XanderSSD/BannedFromHeaven/data/clip_thumbs:/data/clip_thumbs:rw
      - /XanderSSD/BannedFromHeaven/data/tusd:/tusd:rw
      - /XanderSSD/BannedFromHeaven/data/jokes.db:/data/jokes.db:rw
    networks:
      bannedfromheaven:
        ipv4_address: 192.168.4.4

networks:
  traefik:
    external: true
    name: traefik
  bannedfromheaven:
    external: true
    name: bannedfromheaven